
name: CI

on:
  push:
    branches:
      - develop
      - version-16
      - 'feature/**'
  pull_request:

concurrency:
  group: develop-pos_next-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-16 ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-16
          bench get-app pos_next $GITHUB_WORKSPACE
          bench setup requirements --dev
          uv pip install 'setuptools>=71,<82' --python env/bin/python
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app pos_next
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          set -o pipefail
          bench --site test_site run-tests --app pos_next 2>&1 | tee test-output.log
        env:
          TYPE: server

      # The run log needs a signed-in user, while annotations can be read by anyone
      - name: Report Failed Tests
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          { grep -E '^(ERROR|FAIL)[: ]|^[A-Za-z_.]*(Error|Exception): ' test-output.log || tail -n 30 test-output.log; } \
            | cut -c1-170 | awk '!seen[$0]++' | head -n 80 | split -l 16 - failed-part-
          for part in failed-part-*; do
            echo "::error title=Server tests::$(sed ':a;N;$!ba;s/\n/%0A/g' "$part")"
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: POS
        run: yarn install

      # The encryption tests run on the real cipher build, and fail here without it
      - name: Install the desktop database engine
        working-directory: POS/desktop
        run: |
          npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
          npm rebuild better-sqlite3-multiple-ciphers

      - name: Run Tests
        working-directory: POS
        run: yarn test:run
